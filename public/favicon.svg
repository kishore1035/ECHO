<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0a0804"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8a84b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c8a84b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0d97a"/>
      <stop offset="60%" stop-color="#c8a84b"/>
      <stop offset="100%" stop-color="#8c6a1a"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#f0d97a"/>
      <stop offset="40%" stop-color="#c8a84b"/>
      <stop offset="100%" stop-color="#7a5010"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="starGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="roundRect">
      <rect x="0" y="0" width="100" height="100" rx="22" ry="22"/>
    </clipPath>
  </defs>

  <!-- Dark background with rounded corners -->
  <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="url(#bgGrad)"/>

  <!-- Subtle ambient glow -->
  <circle cx="50" cy="50" r="46" fill="url(#glowGrad)"/>

  <!-- Outermost ripple ring — very faint -->
  <circle cx="50" cy="50" r="42"
    fill="none"
    stroke="#c8a84b"
    stroke-width="0.6"
    stroke-opacity="0.18"
    stroke-dasharray="200 2"
    clip-path="url(#roundRect)"/>

  <!-- Second ripple ring — faint -->
  <circle cx="50" cy="50" r="37"
    fill="none"
    stroke="#c8a84b"
    stroke-width="0.7"
    stroke-opacity="0.28"
    clip-path="url(#roundRect)"/>

  <!-- Main broken ring — the Echo Sigil ring -->
  <!-- Drawn as two arcs with a gap at top-right (the "break") -->
  <!-- Arc 1: from ~20° to ~155° (bottom half and left) -->
  <path
    d="M 78.3 29.7 A 32 32 0 1 0 78.3 70.3"
    fill="none"
    stroke="url(#ringGrad)"
    stroke-width="4.5"
    stroke-linecap="round"
    filter="url(#glow)"/>
  <!-- Arc 2: very short arc on right completing near but not touching -->
  <path
    d="M 78.3 70.3 A 32 32 0 0 0 79.5 57"
    fill="none"
    stroke="url(#ringGrad)"
    stroke-width="4.5"
    stroke-linecap="round"
    opacity="0.6"
    filter="url(#glow)"/>

  <!-- Gap sparkle at the break — small gold dot where the ring breaks -->
  <circle cx="79.8" cy="36.5" r="1.6" fill="#f0d97a" opacity="0.9"/>

  <!-- Inner ripple circle — subtle -->
  <circle cx="50" cy="50" r="20"
    fill="none"
    stroke="#c8a84b"
    stroke-width="0.8"
    stroke-opacity="0.35"/>

  <!-- Central star — 4-point starburst -->
  <!-- Horizontal beam -->
  <ellipse cx="50" cy="50" rx="7.5" ry="1.4"
    fill="url(#starGrad)"
    filter="url(#starGlow)"/>
  <!-- Vertical beam -->
  <ellipse cx="50" cy="50" rx="1.4" ry="7.5"
    fill="url(#starGrad)"
    filter="url(#starGlow)"/>
  <!-- Diagonal beam 1 -->
  <ellipse cx="50" cy="50" rx="5.2" ry="0.9"
    fill="url(#starGrad)"
    opacity="0.7"
    transform="rotate(45 50 50)"
    filter="url(#starGlow)"/>
  <!-- Diagonal beam 2 -->
  <ellipse cx="50" cy="50" rx="5.2" ry="0.9"
    fill="url(#starGrad)"
    opacity="0.7"
    transform="rotate(-45 50 50)"
    filter="url(#starGlow)"/>

  <!-- Star core — bright center point -->
  <circle cx="50" cy="50" r="2.8" fill="#fff8e0" filter="url(#starGlow)"/>
  <circle cx="50" cy="50" r="1.5" fill="#ffffff"/>

  <!-- Bottom ripple line — subtle horizontal pulse beneath star -->
  <ellipse cx="50" cy="62" rx="10" ry="1.2"
    fill="none"
    stroke="#c8a84b"
    stroke-width="0.7"
    stroke-opacity="0.5"/>
  <ellipse cx="50" cy="65.5" rx="6.5" ry="0.8"
    fill="none"
    stroke="#c8a84b"
    stroke-width="0.5"
    stroke-opacity="0.3"/>
</svg>